<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rim: smooth metal, lit from the top left -->
    <linearGradient id="rim" x1=".18" y1=".06" x2=".82" y2=".94">
      <stop offset="0" stop-color="#C6FF94"/>
      <stop offset=".42" stop-color="#6CFA04"/>
      <stop offset="1" stop-color="#2C8200"/>
    </linearGradient>
    <!-- Chamfer: the opposite direction, so the face reads as recessed -->
    <linearGradient id="chamfer" x1=".18" y1=".06" x2=".82" y2=".94">
      <stop offset="0" stop-color="#245F00"/>
      <stop offset="1" stop-color="#B4FF70"/>
    </linearGradient>
    <radialGradient id="face" cx=".4" cy=".32" r=".8">
      <stop offset="0" stop-color="#174A2B"/>
      <stop offset="1" stop-color="#05160B"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2FF66"/>
      <stop offset="1" stop-color="#5BD800"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="n" d="M45 44 Q47 24 67 24 L157 24 Q172 24 186 37 L352 201 L367 114 Q370 96 382 87 L473 0 Q473 52 466 100 L434 274 Q431 294 413 294 L315 294 Q300 294 287 282 L122 121 L106 206 Q103 220 93 230 L0 321 Q0 270 7 224 Z"/>
  </defs>

  <!-- Rim, chamfer, face -->
  <circle cx="256" cy="256" r="256" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="226" fill="url(#chamfer)"/>
  <circle cx="256" cy="256" r="220" fill="url(#face)"/>

  <!-- The N: soft shadow, a thin top highlight, then the letter -->
  <use href="#n" transform="translate(118.8 170) scale(.58)" fill="#000" opacity=".45" filter="url(#soft)"/>
  <use href="#n" transform="translate(118.8 160.9) scale(.58)" fill="#E4FFC8"/>
  <use href="#n" transform="translate(118.8 162.9) scale(.58)" fill="url(#mark)"/>
</svg>
