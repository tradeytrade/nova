<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer rim: lit from the top left like polished metal -->
    <linearGradient id="rim" x1=".15" y1=".05" x2=".85" y2=".95">
      <stop offset="0" stop-color="#E2FFC2"/>
      <stop offset=".2" stop-color="#9BFF4D"/>
      <stop offset=".48" stop-color="#62E400"/>
      <stop offset=".75" stop-color="#3A9A00"/>
      <stop offset="1" stop-color="#1D5800"/>
    </linearGradient>
    <!-- Inner bevel: the opposite direction, so it reads as a step down -->
    <linearGradient id="bevel" x1=".85" y1=".95" x2=".15" y2=".05">
      <stop offset="0" stop-color="#C8FF94"/>
      <stop offset=".45" stop-color="#6CFA04"/>
      <stop offset="1" stop-color="#256A00"/>
    </linearGradient>
    <radialGradient id="face" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#1E5A36"/>
      <stop offset=".5" stop-color="#0E301C"/>
      <stop offset="1" stop-color="#04130A"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2FF9C"/>
      <stop offset=".38" stop-color="#7DFF1A"/>
      <stop offset="1" stop-color="#47B800"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".18" r=".62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6CFA04" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6CFA04" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceClip"><circle cx="256" cy="256" r="210"/></clipPath>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <path id="n" d="M45 44 Q47 24 67 24 L157 24 Q172 24 186 37 L352 201 L367 114 Q370 96 382 87 L473 0 Q473 52 466 100 L434 274 Q431 294 413 294 L315 294 Q300 294 287 282 L122 121 L106 206 Q103 220 93 230 L0 321 Q0 270 7 224 Z"/>
    <path id="star" d="M0 -16 C1.6 -3.6 3.6 -1.6 16 0 C3.6 1.6 1.6 3.6 0 16 C-1.6 3.6 -3.6 1.6 -16 0 C-3.6 -1.6 -1.6 -3.6 0 -16 Z"/>
  </defs>

  <!-- Rim with a milled (reeded) edge -->
  <circle cx="256" cy="256" r="256" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#174A00" stroke-opacity=".5" stroke-width="9" stroke-dasharray="2.4 4.066"/>
  <circle cx="256" cy="256" r="242" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="1.2"/>

  <!-- Bevel and groove -->
  <circle cx="256" cy="256" r="233" fill="url(#bevel)"/>
  <circle cx="256" cy="256" r="215" fill="#061A0D"/>

  <!-- Face -->
  <circle cx="256" cy="256" r="210" fill="url(#face)"/>
  <g clip-path="url(#faceClip)">
    <!-- Sunburst engraving -->
    <circle cx="256" cy="256" r="105" fill="none" stroke="#6CFA04" stroke-opacity=".07" stroke-width="210" stroke-dasharray="0.9 4.5975"/>
    <circle cx="256" cy="256" r="150" fill="url(#glow)"/>
    <circle cx="256" cy="256" r="197" fill="none" stroke="#6CFA04" stroke-opacity=".32" stroke-width="1.2"/>
    <circle cx="256" cy="256" r="188" fill="none" stroke="#6CFA04" stroke-opacity=".5" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.01 9.84"/>
    <ellipse cx="200" cy="150" rx="230" ry="170" fill="url(#sheen)"/>
  </g>

  <!-- Sparkles (a nova is a star that suddenly shines) -->
  <use href="#star" transform="translate(366 150)" fill="#E2FFC2"/>
  <use href="#star" transform="translate(146 368) scale(.55)" fill="#E2FFC2" opacity=".75"/>
  <use href="#star" transform="translate(392 330) scale(.35)" fill="#E2FFC2" opacity=".6"/>

  <!-- Embossed N: shadow, top highlight, then the face of the letter -->
  <use href="#n" transform="translate(123.6 175) scale(.56)" fill="#000" opacity=".6" filter="url(#blur)"/>
  <use href="#n" transform="translate(123.6 163.6) scale(.56)" fill="#EAFFD2"/>
  <use href="#n" transform="translate(123.6 166.1) scale(.56)" fill="url(#mark)"/>
</svg>
